<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VigilanceCore | PV Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #0a1628;
      --navy-mid: #112240;
      --navy-light: #1a3358;
      --teal: #00c9a7;
      --teal-dim: #00a88d;
      --gold: #c9a84c;
      --gold-light: #e2c97e;
      --white: #f5f7fa;
      --muted: #8899aa;
      --card-bg: rgba(17, 34, 64, 0.7);
      --border: rgba(0, 201, 167, 0.18);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--navy);
      color: var(--white);
      overflow-x: hidden;
    }

    /* ── CURSOR ── */
    .cursor {
      width: 10px; height: 10px;
      background: var(--teal);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9999;
      transition: transform 0.15s ease;
    }
    .cursor-ring {
      width: 36px; height: 36px;
      border: 1.5px solid var(--teal);
      border-radius: 50%;
      position: fixed; top: 0; left: 0;
      pointer-events: none; z-index: 9998;
      transition: transform 0.35s cubic-bezier(.23,1,.32,1), opacity 0.3s;
      opacity: 0.5;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; width: 100%; z-index: 900;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 5%;
      background: rgba(10, 22, 40, 0.82);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      animation: slideDown 0.8s ease forwards;
    }
    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0);     opacity: 1; }
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem; font-weight: 700;
      color: var(--white);
      letter-spacing: 0.04em;
    }
    .nav-logo span { color: var(--teal); }
    .nav-links { display: flex; gap: 2.2rem; list-style: none; }
    .nav-links a {
      color: var(--muted); text-decoration: none;
      font-size: 0.85rem; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--teal); }
    .nav-cta {
      padding: 0.55rem 1.5rem;
      border: 1.5px solid var(--teal);
      color: var(--teal); background: transparent;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      cursor: pointer; border-radius: 3px;
      transition: background 0.3s, color 0.3s;
    }
    .nav-cta:hover { background: var(--teal); color: var(--navy); }

    /* ── HERO ── */
    #hero {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 120px 5% 80px;
      position: relative; overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 30%, rgba(0,201,167,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 70%, rgba(201,168,76,0.06) 0%, transparent 60%),
        linear-gradient(180deg, #0a1628 0%, #0d1e3c 100%);
    }
    .grid-overlay {
      position: absolute; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(0,201,167,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,201,167,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .hero-badge {
      display: inline-block;
      padding: 0.35rem 1.1rem;
      border: 1px solid var(--teal);
      border-radius: 50px;
      color: var(--teal);
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 2rem;
      position: relative; z-index: 1;
      animation: fadeUp 0.9s 0.3s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 600; line-height: 1.08;
      position: relative; z-index: 1;
      animation: fadeUp 0.9s 0.5s ease both;
    }
    .hero h1 em {
      font-style: italic; color: var(--teal);
      display: block;
    }
    .hero-sub {
      margin-top: 1.5rem;
      max-width: 560px;
      font-size: 1rem; font-weight: 300;
      color: var(--muted); line-height: 1.75;
      position: relative; z-index: 1;
      animation: fadeUp 0.9s 0.7s ease both;
    }
    .hero-actions {
      margin-top: 2.5rem;
      display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;
      position: relative; z-index: 1;
      animation: fadeUp 0.9s 0.9s ease both;
    }
    .btn-primary {
      padding: 0.85rem 2.2rem;
      background: var(--teal);
      color: var(--navy);
      border: none; border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 0 20px rgba(0,201,167,0.3);
    }
    .btn-primary:hover {
      background: var(--teal-dim);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,201,167,0.4);
    }
    .btn-ghost {
      padding: 0.85rem 2.2rem;
      background: transparent;
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem; font-weight: 500;
      letter-spacing: 0.06em; text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.3s, background 0.3s;
    }
    .btn-ghost:hover {
      border-color: var(--white);
      background: rgba(255,255,255,0.05);
    }
    .hero-stats {
      margin-top: 5rem;
      display: flex; gap: 3.5rem; justify-content: center; flex-wrap: wrap;
      position: relative; z-index: 1;
      animation: fadeUp 0.9s 1.1s ease both;
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem; font-weight: 700;
      color: var(--teal); display: block;
    }
    .stat-label {
      font-size: 0.75rem; font-weight: 500;
      color: var(--muted); letter-spacing: 0.1em;
      text-transform: uppercase; margin-top: 0.3rem;
    }
    .hero-scroll {
      position: absolute; bottom: 2.5rem; left: 50%;
      transform: translateX(-50%);
      z-index: 1; animation: bounce 2s infinite 2s;
      color: var(--muted); font-size: 0.72rem;
      letter-spacing: 0.15em; text-transform: uppercase;
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    }
    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(8px); }
    }
    .scroll-line {
      width: 1px; height: 40px;
      background: linear-gradient(to bottom, var(--teal), transparent);
    }

    /* ── SECTION COMMONS ── */
    section { padding: 7rem 5%; }
    .section-label {
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--teal); margin-bottom: 1rem;
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 600; line-height: 1.2;
    }
    .section-title span { color: var(--teal); font-style: italic; }
    .section-desc {
      margin-top: 1rem;
      max-width: 520px;
      font-size: 0.95rem; font-weight: 300;
      color: var(--muted); line-height: 1.8;
    }

    /* ── ABOUT STRIP ── */
    #about {
      background: var(--navy-mid);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 3rem; padding: 5rem 5%;
    }
    .about-text { max-width: 560px; }
    .about-text p {
      margin-top: 1.2rem;
      font-size: 0.95rem; font-weight: 300;
      color: var(--muted); line-height: 1.9;
    }
    .about-features {
      display: flex; flex-direction: column; gap: 1rem;
    }
    .about-feat {
      display: flex; align-items: center; gap: 0.9rem;
      font-size: 0.9rem; font-weight: 400; color: var(--white);
    }
    .feat-icon {
      width: 36px; height: 36px; min-width: 36px;
      border-radius: 8px;
      background: rgba(0,201,167,0.1);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    /* ── SOLUTIONS ── */
    #solutions { background: var(--navy); }
    .solutions-header { max-width: 700px; margin-bottom: 4rem; }
    .solutions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .sol-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.2rem;
      position: relative; overflow: hidden;
      transition: transform 0.35s ease, border-color 0.35s, box-shadow 0.35s;
      cursor: default;
    }
    .sol-card::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(0,201,167,0.06) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.4s;
    }
    .sol-card:hover { transform: translateY(-6px); border-color: rgba(0,201,167,0.45); box-shadow: 0 20px 50px rgba(0,0,0,0.35); }
    .sol-card:hover::before { opacity: 1; }
    .sol-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem; font-weight: 700;
      color: rgba(0,201,167,0.12);
      position: absolute; top: 1.5rem; right: 1.8rem;
      line-height: 1;
      transition: color 0.35s;
    }
    .sol-card:hover .sol-num { color: rgba(0,201,167,0.22); }
    .sol-icon {
      width: 48px; height: 48px;
      background: rgba(0,201,167,0.1);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin-bottom: 1.4rem;
    }
    .sol-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem; font-weight: 600;
      margin-bottom: 0.8rem; color: var(--white);
    }
    .sol-card p {
      font-size: 0.88rem; font-weight: 300;
      color: var(--muted); line-height: 1.75;
    }
    .sol-tags {
      margin-top: 1.4rem;
      display: flex; flex-wrap: wrap; gap: 0.5rem;
    }
    .sol-tag {
      padding: 0.28rem 0.75rem;
      background: rgba(0,201,167,0.07);
      border: 1px solid rgba(0,201,167,0.2);
      border-radius: 50px;
      font-size: 0.72rem; font-weight: 500;
      color: var(--teal);
      letter-spacing: 0.06em;
    }

    /* ── PROCESS ── */
    #process {
      background: var(--navy-mid);
      border-top: 1px solid var(--border);
    }
    .process-header { max-width: 600px; margin-bottom: 4rem; }
    .process-steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0; position: relative;
    }
    .process-steps::before {
      content: '';
      position: absolute; top: 36px; left: 10%; right: 10%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
      opacity: 0.3;
    }
    .process-step {
      text-align: center; padding: 1.5rem;
      animation: fadeUp 0.8s ease both;
    }
    .step-num {
      width: 72px; height: 72px; margin: 0 auto 1.4rem;
      border-radius: 50%;
      border: 1.5px solid var(--teal);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem; font-weight: 700; color: var(--teal);
      background: rgba(0,201,167,0.05);
      position: relative; z-index: 1;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .process-step:hover .step-num {
      background: rgba(0,201,167,0.15);
      box-shadow: 0 0 20px rgba(0,201,167,0.25);
    }
    .process-step h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem; font-weight: 600;
      margin-bottom: 0.6rem;
    }
    .process-step p {
      font-size: 0.83rem; color: var(--muted);
      font-weight: 300; line-height: 1.7;
    }

    /* ── COMPLIANCE ── */
    #compliance { background: var(--navy); }
    .compliance-inner {
      display: flex; align-items: flex-start; gap: 5rem; flex-wrap: wrap;
    }
    .compliance-text { flex: 1; min-width: 280px; }
    .compliance-grid {
      flex: 1.2; min-width: 280px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .comp-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.4rem 1.2rem;
      transition: border-color 0.3s, transform 0.3s;
    }
    .comp-item:hover {
      border-color: rgba(201,168,76,0.5);
      transform: scale(1.02);
    }
    .comp-item strong {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem; display: block; margin-bottom: 0.35rem;
      color: var(--gold-light);
    }
    .comp-item span {
      font-size: 0.8rem; color: var(--muted);
      font-weight: 300; line-height: 1.6;
    }

    /* ── TESTIMONIALS ── */
    #testimonials {
      background: var(--navy-mid);
      border-top: 1px solid var(--border);
    }
    .testimonials-header { text-align: center; margin-bottom: 3.5rem; }
    .testimonials-header .section-desc { margin: 1rem auto 0; }
    .testi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .testi-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 2rem;
      position: relative; overflow: hidden;
      transition: transform 0.3s, border-color 0.3s;
    }
    .testi-card:hover {
      transform: translateY(-4px);
      border-color: rgba(201,168,76,0.35);
    }
    .testi-quote {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem; color: var(--teal);
      opacity: 0.2; line-height: 0.6;
      position: absolute; top: 1.5rem; left: 1.5rem;
    }
    .testi-text {
      margin-top: 1.5rem;
      font-size: 0.9rem; color: var(--muted);
      font-weight: 300; line-height: 1.8;
      font-style: italic;
    }
    .testi-author {
      margin-top: 1.5rem;
      display: flex; align-items: center; gap: 0.9rem;
    }
    .testi-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, var(--teal), var(--navy-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; font-weight: 600; color: var(--navy);
    }
    .testi-name {
      font-size: 0.88rem; font-weight: 600; color: var(--white);
    }
    .testi-role {
      font-size: 0.75rem; color: var(--muted);
    }

    /* ── CTA BAND ── */
    #cta {
      background: linear-gradient(135deg, var(--navy-light) 0%, var(--navy-mid) 100%);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: center;
      padding: 6rem 5%;
      position: relative; overflow: hidden;
    }
    #cta::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 70% at 50% 50%, rgba(0,201,167,0.07) 0%, transparent 70%);
    }
    #cta h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 600; position: relative; z-index: 1;
    }
    #cta h2 span { color: var(--teal); font-style: italic; }
    #cta p {
      margin: 1.2rem auto 2.5rem;
      max-width: 480px;
      font-size: 0.95rem; color: var(--muted);
      font-weight: 300; line-height: 1.8;
      position: relative; z-index: 1;
    }
    .cta-actions { position: relative; z-index: 1; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

    /* ── FOOTER ── */
    footer {
      background: #06101e;
      border-top: 1px solid var(--border);
      padding: 4rem 5% 2rem;
    }
    .footer-top {
      display: flex; justify-content: space-between; flex-wrap: wrap;
      gap: 3rem; padding-bottom: 3rem;
      border-bottom: 1px solid var(--border);
    }
    .footer-brand .nav-logo { font-size: 1.6rem; }
    .footer-brand p {
      margin-top: 0.8rem; max-width: 240px;
      font-size: 0.82rem; color: var(--muted);
      font-weight: 300; line-height: 1.7;
    }
    .footer-col h5 {
      font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--teal); margin-bottom: 1.2rem;
    }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.65rem; }
    .footer-col a {
      font-size: 0.85rem; color: var(--muted);
      text-decoration: none; transition: color 0.3s;
    }
    .footer-col a:hover { color: var(--white); }
    .footer-bottom {
      padding-top: 2rem;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 1rem;
    }
    .footer-bottom p {
      font-size: 0.78rem; color: var(--muted);
    }
    .footer-bottom span { color: var(--teal); font-weight: 500; }
    .dev-credit {
      font-size: 0.78rem; color: var(--muted);
    }
    .dev-credit a {
      color: var(--gold-light); text-decoration: none;
      font-weight: 500; transition: color 0.3s;
    }
    .dev-credit a:hover { color: var(--gold); }

    /* ── FLOATING PARTICLES ── */
    .particles {
      position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
    }
    .particle {
      position: absolute; border-radius: 50%;
      background: var(--teal);
      animation: float linear infinite;
      opacity: 0;
    }
    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 0.25; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* ── SCROLL REVEAL ── */
    .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.7s ease, transform 0.7s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ── GLOW PULSE ── */
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 15px rgba(0,201,167,0.2); }
      50%       { box-shadow: 0 0 30px rgba(0,201,167,0.45); }
    }
    .glow-pulse { animation: glowPulse 3s ease-in-out infinite; }

    /* ── TYPING CURSOR ── */
    .typed::after {
      content: '|'; color: var(--teal);
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .process-steps::before { display: none; }
      .compliance-inner { flex-direction: column; }
      .footer-top { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- NAV -->
  <nav>
    <div class="nav-logo">Vigilance<span>Core</span></div>
    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#solutions">Solutions</a></li>
      <li><a href="#process">Process</a></li>
      <li><a href="#compliance">Compliance</a></li>
      <li><a href="#testimonials">Clients</a></li>
    </ul>
    <button class="nav-cta">Request Demo</button>
  </nav>

  <!-- HERO -->
